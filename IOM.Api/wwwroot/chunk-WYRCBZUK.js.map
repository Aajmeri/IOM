<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Edit User</h3>
      </div>
      <div class="card-body">
        @if (loading) {
          <div class="text-center py-3"><span class="spinner-border text-primary"></span></div>
        } @else {
          @if (error) {
            <div class="alert alert-danger">{{ error }}</div>
          }
          <form (ngSubmit)="submit()" #f="ngForm">
            <div class="form-group">
              <label>Email</label>
              <input type="text" class="form-control" [value]="email" disabled>
            </div>
            <div class="form-group">
              <label>Name</label>
              <input type="text" class="form-control" [(ngModel)]="model.name" name="name" required>
            </div>
            <div class="form-group">
              <label>Role</label>
              <select class="form-control" [(ngModel)]="model.role" name="role" required>
                @for (role of roles; track role) {
                  <option [value]="role">{{ role }}</option>
                }
              </select>
            </div>
            <div class="form-group">
              <div class="custom-control custom-switch">
                <input type="checkbox" class="custom-control-input" id="active"
                       [(ngModel)]="model.active" name="active">
                <label class="custom-control-label" for="active">Active</label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" [disabled]="saving">
              @if (saving) { <span class="spinner-border spinner-border-sm mr-1"></span> }
              Save
            </button>
            <a routerLink="/users" class="btn btn-secondary ml-2">Cancel</a>
          </form>
        }
      </div>
    </div>
  </div>
</div>
