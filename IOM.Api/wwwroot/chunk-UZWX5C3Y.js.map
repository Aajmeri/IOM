<div class="register-box">
  <div class="register-logo">
    <b>Royal</b> Distributors
  </div>
  <div class="card">
    <div class="card-body register-card-body">
      <p class="login-box-msg">Create a new account</p>

      @if (error) {
        <div class="alert alert-danger alert-dismissible fade show">
          <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
          {{ error }}
        </div>
      }

      <form (ngSubmit)="submit()" #f="ngForm">
        <div class="input-group mb-1">
          <input type="text" class="form-control" placeholder="Full Name"
                 [(ngModel)]="name" name="name" required autofocus autocomplete="name">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-user"></span></div>
          </div>
        </div>

        <div class="input-group mb-1 mt-2">
          <input type="email" class="form-control" placeholder="Email"
                 [(ngModel)]="email" name="email" required autocomplete="email">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
          </div>
        </div>

        <div class="input-group mb-1 mt-2">
          <input type="password" class="form-control" placeholder="Password"
                 [(ngModel)]="password" name="password" required autocomplete="new-password">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
        </div>

        <div class="input-group mb-3 mt-2">
          <input type="password" class="form-control" placeholder="Confirm Password"
                 [(ngModel)]="confirmPassword" name="confirmPassword" required autocomplete="new-password">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
              @if (loading) { <span class="spinner-border spinner-border-sm mr-1"></span> }
              Create Account
            </button>
          </div>
        </div>
      </form>

      <p class="mt-3 mb-0 text-center">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
