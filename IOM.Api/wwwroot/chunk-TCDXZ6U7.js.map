<div class="login-box">
  <div class="login-logo">
    <b>Royal</b> Distributors
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to start your session</p>

      @if (error) {
        <div class="alert alert-danger alert-dismissible fade show">
          <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
          {{ error }}
        </div>
      }

      <form (ngSubmit)="submit()" #f="ngForm">
        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email"
                 [(ngModel)]="email" name="email" required autofocus autocomplete="email">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password"
                 [(ngModel)]="password" name="password" required autocomplete="current-password">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
        </div>

        <div class="row">
          <div class="col-8 d-flex align-items-center">
            <div class="icheck-primary">
              <input type="checkbox" id="remember" [(ngModel)]="rememberMe" name="rememberMe">
              <label for="remember">Remember Me</label>
            </div>
          </div>
          <div class="col-4">
            <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
              @if (loading) { <span class="spinner-border spinner-border-sm mr-1"></span> }
              Sign In
            </button>
          </div>
        </div>
      </form>

      <p class="mt-3 mb-0 text-center">
        <a routerLink="/register">Create an account</a>
      </p>
    </div>
  </div>
</div>
