<div class="wrapper">
  <!-- Top Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a routerLink="/products" class="nav-link">Item Operating Management System</a>
      </li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item dropdown">
        <a class="nav-link" data-toggle="dropdown" href="#">
          <i class="fas fa-user-circle mr-1"></i>
          <span class="d-none d-sm-inline">{{ auth.currentUser()?.name }}</span>
        </a>
        <div class="dropdown-menu dropdown-menu-right">
          <div class="dropdown-divider"></div>
          <a href="#" class="dropdown-item" (click)="$event.preventDefault(); auth.logout()">
            <i class="fas fa-sign-out-alt mr-2"></i> Log out
          </a>
        </div>
      </li>
    </ul>
  </nav>

  <!-- Sidebar -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a routerLink="/products" class="brand-link">
      <span class="brand-text font-weight-light pl-3">Royal Distributors</span>
    </a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item">
            <a routerLink="/products" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-box"></i>
              <p>Products</p>
            </a>
          </li>
          @if (auth.isAdmin()) {
            <li class="nav-item">
              <a routerLink="/users" routerLinkActive="active" class="nav-link">
                <i class="nav-icon fas fa-users"></i>
                <p>Users</p>
              </a>
            </li>
          }
          <li class="nav-item">
            <a routerLink="/suppliers" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-industry"></i>
              <p>Suppliers</p>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/schedule" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-calendar-alt"></i>
              <p>Schedule Shipping</p>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/orders" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-shopping-cart"></i>
              <p>Orders</p>
            </a>
          </li>
          <li class="nav-item">
            <a routerLink="/deliveries" routerLinkActive="active" class="nav-link">
              <i class="nav-icon fas fa-truck"></i>
              <p>Deliveries</p>
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <div class="content pt-3">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <footer class="main-footer">
    <strong>Item Operating Management System</strong>
  </footer>

  <aside class="control-sidebar control-sidebar-dark"></aside>
</div>
